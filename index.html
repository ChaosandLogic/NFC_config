<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#efe8dc" />
    <meta
      name="description"
      content="Write a Wi-Fi network name and password to an NFC tag."
    />
    <title>NFC Wi-Fi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@380;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="shell">
      <header class="intro">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="40" r="3.2" fill="currentColor" />
            <path
              d="M22 34.5c5.4-5.2 14.6-5.2 20 0"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
            <path
              d="M16 28.5c8.8-8.5 23.2-8.5 32 0"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
            <path
              d="M10 22.5c12.2-11.8 31.8-11.8 44 0"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <p class="eyebrow">NFC config</p>
        <h1>Wi-Fi on a tap.</h1>
        <p class="lede">
          Enter the network name and password. Write them to a tag, or show a QR
          code.
        </p>
      </header>

      <form id="wifi-form" class="card" novalidate>
        <label class="field">
          <span>Network name</span>
          <input
            id="ssid"
            name="ssid"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            maxlength="32"
            placeholder="SSID"
            required
          />
        </label>

        <label class="field">
          <span class="label-row">
            Password
            <button type="button" class="text-btn" id="toggle-password" aria-pressed="false">
              Show
            </button>
          </span>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="off"
            spellcheck="false"
            maxlength="63"
            placeholder="Leave blank if open"
          />
        </label>

        <p class="hint" id="nfc-hint"></p>

        <div class="actions">
          <button type="submit" class="primary" id="write-btn">Write NFC tag</button>
          <button type="button" class="ghost" id="cancel-btn" hidden>Cancel</button>
          <button type="button" class="ghost" id="qr-btn">Show QR code</button>
        </div>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <section class="qr-panel" id="qr-panel" hidden>
        <img id="qr-image" alt="Wi-Fi QR code" />
        <p>Point a camera at the code to join the network.</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
